<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decktech</title>
  <meta name="color-scheme" content="light dark">
  <style>
    /* Colours mirror the app tokens in src/styles.css. */
    :root {
      --surface: #f5f6f8;
      --surface-sunken: #e9ebf0;
      --text: #1a1e26;
      --text-muted: #4a5262;
      --accent: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #13161b;
        --surface-sunken: #0e1014;
        --text: #e8eaee;
        --text-muted: #a9b0bd;
        --accent: #6c9bff;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      user-select: none;
      cursor: default;
    }
    main {
      display: grid;
      justify-items: center;
      gap: 1rem;
    }
    .logo {
      width: 72px;
      height: 54px;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .bar {
      width: 160px;
      height: 3px;
      border-radius: 2px;
      background: var(--surface-sunken);
      overflow: hidden;
    }
    .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar::after {
        width: 100%;
        animation: none;
        opacity: 0.6;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 72 54" aria-hidden="true">
      <rect x="10" y="2" width="58" height="38" rx="5" fill="none" stroke="var(--accent)" stroke-width="3" opacity="0.45"/>
      <rect x="3" y="12" width="58" height="38" rx="5" fill="var(--accent)"/>
    </svg>
    <h1>Decktech</h1>
    <div class="bar" role="progressbar" aria-label="Loading Decktech"></div>
    <p>Loading…</p>
  </main>
</body>
</html>
