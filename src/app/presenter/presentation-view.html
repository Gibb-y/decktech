<h1 class="sr-only">{{ deck().title }} (presentation)</h1>
<div
  class="stage"
  [style.--ratio]="ratio()"
  [style.--duration]="duration()"
  (click)="onClick()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
>
  @for (layer of layers(); track layer.slide.id) {
    <div
      class="layer"
      [class.current]="layer.current"
      [class.leaving]="layer.leaving"
      [attr.data-transition]="layer.transition"
      [attr.aria-hidden]="layer.current ? null : 'true'"
      [attr.inert]="layer.current ? null : ''"
    >
      <app-slide-renderer
        mode="present"
        [slide]="layer.slide"
        [theme]="deck().theme"
        [layout]="layer.layout"
        [stage]="deck().stage"
        [step]="layer.step"
        [components]="deck().components"
        [deckId]="deck().id"
        [distance]="layer.distance"
      />
    </div>
  }
</div>
<div class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ announcement() }}</div>
<div class="controls" role="group" aria-label="Presentation controls" [class.visible]="controlsVisible()">
  <button type="button" [attr.aria-disabled]="atStart()" (click)="previous()">Previous</button>
  <span class="position" aria-hidden="true">{{ position() }}</span>
  <button type="button" [attr.aria-disabled]="atEnd()" (click)="onNextButton()">Next</button>
  <button type="button" (click)="openPresenterView()">Presenter view</button>
  <button type="button" (click)="exit()">Exit</button>
</div>
