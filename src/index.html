<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Decktech</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Sets the colour scheme before the first paint (no flash). Keep in step with shared/color-scheme.ts.
    (function () {
      var mode = 'system';
      try {
        var stored = localStorage.getItem('decktech.colorScheme');
        if (stored === 'dark' || stored === 'system' || stored === 'light') mode = stored;
      } catch (e) {}
      if (mode !== 'system') document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
